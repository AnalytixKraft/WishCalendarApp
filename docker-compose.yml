# Birthday Reminder: the app (pages + the daily clock) and the WhatsApp
# bridge, plus an optional Cloudflare tunnel. README.md says how to run it.
#
#   docker compose up -d --build                    app + bridge, on localhost
#   docker compose --profile tunnel up -d --build   ... and the tunnel

name: birthday-reminder

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ./app
    image: birthday-reminder-app:local
    pull_policy: build
    restart: unless-stopped
    init: true
    environment:
      BRIDGE_URL: http://whatsapp.:3000
      BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
    # This computer only. To reach it from elsewhere, use the tunnel below —
    # never publish it on 0.0.0.0.
    ports:
      - "127.0.0.1:${APP_PORT:-3210}:3210"
    volumes:
      # The database: people, groups, settings, what was sent.
      - app_data:/data
    # `default` for the page (and the tunnel); `whatsapp` to reach the bridge.
    networks: [default, whatsapp]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3210/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging

  whatsapp:
    build:
      context: ./whatsapp
    image: birthday-reminder-whatsapp:local
    pull_policy: build
    restart: unless-stopped
    # tini as PID 1: passes `docker stop`'s SIGTERM on, so the bridge closes
    # its session cleanly — it never logs out on a stop; the link survives
    # restarts, upgrades and reboots.
    init: true
    environment:
      # Blank or short, the bridge runs `unconfigured`: it never contacts
      # WhatsApp, answers 503, and logs the fix.
      BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-}
    volumes:
      # /data/auth is the linked-device session: a live credential for the
      # WhatsApp account. Deleting the volume unlinks the phone (at our end).
      - whatsapp_auth:/data
    # Only the app shares this network. NO `ports:`, and not in the tunnel.
    # Not `internal: true` — the bridge has to reach web.whatsapp.com.
    networks: [whatsapp]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      # Liveness only: "not linked" is a normal state, not a sick container.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  # Optional: publish the app on a hostname of yours through a Cloudflare
  # tunnel, with no port opened on this computer. Needs CLOUDFLARE_TUNNEL_TOKEN
  # in .env, and the tunnel's public hostname pointed at http://app:3210 in the
  # Cloudflare dashboard (README.md, "Reach it from anywhere").
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    # The page only: the tunnel has no route to the bridge.
    networks: [default]
    depends_on: [app]
    logging: *logging

networks:
  default: {}
  whatsapp: {}

volumes:
  app_data:
  whatsapp_auth:
